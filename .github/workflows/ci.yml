name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      # tsc -b, not tsc --noEmit: this is a solution-style tsconfig (Vite
      # template with `references`), and plain --noEmit on it checks NOTHING.
      - run: npx tsc -b --force
      - run: npm test
      - run: npm run build
